services:
  # 1. Raydrop WAN Signaling & STUN Server (stun.raydrop.web.id)
  raydrop-signal:
    build:
      context: ./signal-server
      dockerfile: Dockerfile
    container_name: raydrop-signal
    restart: unless-stopped
    environment:
      - SIGNAL_HTTP_ADDR=0.0.0.0:8080
      - SIGNAL_UDP_ADDR=0.0.0.0:3478
      - SIGNAL_DB_PATH=/data/signal.db
      - RUST_LOG=info
    volumes:
      - raydrop_signal_data:/data
    ports:
      # Direct UDP port for STUN / NAT Public IP:Port Discovery
      - "3478:3478/udp"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTP -> HTTPS Redirect
      - "traefik.http.middlewares.raydrop-signal-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.raydrop-signal-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.raydrop-signal-web.rule=Host(`${SIGNAL_DOMAIN:-stun.raydrop.web.id}`)"
      - "traefik.http.routers.raydrop-signal-web.entrypoints=web"
      - "traefik.http.routers.raydrop-signal-web.middlewares=raydrop-signal-redirect"
      # HTTPS & WSS (Port 443 via Let's Encrypt)
      - "traefik.http.routers.raydrop-signal.rule=Host(`${SIGNAL_DOMAIN:-stun.raydrop.web.id}`)"
      - "traefik.http.routers.raydrop-signal.entrypoints=websecure"
      - "traefik.http.routers.raydrop-signal.tls=true"
      - "traefik.http.routers.raydrop-signal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.raydrop-signal.service=raydrop-signal-svc"
      - "traefik.http.services.raydrop-signal-svc.loadbalancer.server.port=8080"

  # 2. Raydrop Official Modern Download Landing Page (raydrop.web.id)
  raydrop-landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: raydrop-landing
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTP -> HTTPS Redirect
      - "traefik.http.middlewares.raydrop-landing-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.raydrop-landing-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.raydrop-landing-web.rule=Host(`${LANDING_DOMAIN:-raydrop.web.id}`)"
      - "traefik.http.routers.raydrop-landing-web.entrypoints=web"
      - "traefik.http.routers.raydrop-landing-web.middlewares=raydrop-landing-redirect"
      # HTTPS (Port 443 via Let's Encrypt)
      - "traefik.http.routers.raydrop-landing.rule=Host(`${LANDING_DOMAIN:-raydrop.web.id}`)"
      - "traefik.http.routers.raydrop-landing.entrypoints=websecure"
      - "traefik.http.routers.raydrop-landing.tls=true"
      - "traefik.http.routers.raydrop-landing.tls.certresolver=letsencrypt"
      - "traefik.http.routers.raydrop-landing.service=raydrop-landing-svc"
      - "traefik.http.services.raydrop-landing-svc.loadbalancer.server.port=80"

volumes:
  raydrop_signal_data:

networks:
  dokploy-network:
    external: true


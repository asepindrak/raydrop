name: Release Raydrop Desktop Installers

on:
  # Temporarily paused while finalizing Android CI build
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Raydrop v__VERSION__'
          releaseBody: '### Raydrop Universal P2P File Transfer (v__VERSION__)\n\nDownload the installer for your operating system below:\n- **Windows (x64):** `Raydrop___VERSION___x64_en-US.msi`\n- **macOS (Universal):** `Raydrop___VERSION___universal.dmg`\n- **Linux (x64):** `.deb` or `.AppImage`\n\nFeatures:\n- Zero-Server P2P High-Speed File Transfer (LAN + Tailscale + WAN Relay)\n- End-to-End Encrypted Real-Time Chat\n- 6-Stream Parallel Chunk Acceleration\n- Keepalive Heartbeats & Auto-Resume'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


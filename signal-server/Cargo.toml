[package]
name = "raydrop-signal-server"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.41", features = ["full"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.1"
ed25519-dalek = "2.1"
blake3 = "1.5"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"


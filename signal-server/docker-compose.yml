services:
  raydrop-signal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raydrop-signal
    restart: unless-stopped
    environment:
      - SIGNAL_HTTP_ADDR=0.0.0.0:8080
      - SIGNAL_UDP_ADDR=0.0.0.0:3478
      - RUST_LOG=info
    ports:
      # Direct UDP port for STUN / NAT Public IP:Port Discovery (bypasses HTTP proxy)
      - "3478:3478/udp"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # HTTP (Port 80) -> Auto Redirect to HTTPS
      - "traefik.http.middlewares.raydrop-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.raydrop-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.raydrop-signal-web.rule=Host(`${SIGNAL_DOMAIN:-raydrop.gapleh.online}`)"
      - "traefik.http.routers.raydrop-signal-web.entrypoints=web"
      - "traefik.http.routers.raydrop-signal-web.middlewares=raydrop-https-redirect"
      # HTTPS & WSS (Port 443 via Let's Encrypt)
      - "traefik.http.routers.raydrop-signal.rule=Host(`${SIGNAL_DOMAIN:-raydrop.gapleh.online}`)"
      - "traefik.http.routers.raydrop-signal.entrypoints=websecure"
      - "traefik.http.routers.raydrop-signal.tls=true"
      - "traefik.http.routers.raydrop-signal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.raydrop-signal.service=raydrop-signal-svc"
      - "traefik.http.services.raydrop-signal-svc.loadbalancer.server.port=8080"

networks:
  dokploy-network:
    external: true


name: Build Raydrop Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npx @tauri-apps/cli android init --ci
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}

      - name: Apply Raydrop App Icons to Android Project
        run: |
          cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      - name: Configure Android Manifest Permissions
        run: python3 scripts/patch_android_manifest.py

      - name: Build Android APK (ARM64)
        run: npx @tauri-apps/cli android build --apk --target aarch64 --ci
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}

      - name: Sign and Align Android APK
        run: |
          mkdir -p build-output
          RAW_APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          echo "Found generated raw APK: $RAW_APK"

          keytool -genkeypair -v \
            -keystore raydrop.keystore \
            -alias raydrop \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass raydrop123 \
            -keypass raydrop123 \
            -dname "CN=Raydrop, OU=Raydrop Team, O=Raydrop, L=Jakarta, ST=Jakarta, C=ID"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS"

          $BUILD_TOOLS/zipalign -v -p 4 "$RAW_APK" aligned.apk

          $BUILD_TOOLS/apksigner sign \
            --ks raydrop.keystore \
            --ks-pass pass:raydrop123 \
            --ks-key-alias raydrop \
            --key-pass pass:raydrop123 \
            --out build-output/Raydrop-arm64-v8a.apk \
            aligned.apk

          $BUILD_TOOLS/apksigner verify --verbose build-output/Raydrop-arm64-v8a.apk
          ls -lah build-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raydrop-Android-arm64-v8a-apk
          path: build-output/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload "${{ github.ref_name }}" build-output/*.apk --clobber || gh release create "${{ github.ref_name }}" build-output/*.apk --title "Raydrop ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
